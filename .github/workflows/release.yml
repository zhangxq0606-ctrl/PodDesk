name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1; leave empty to use v<package.json version>)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VER=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Verify version consistency with tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/sync-version.mjs --check --tag "$TAG"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: installer-windows
            bundle_path: desktop/target/release/bundle/nsis/*.exe
          - os: macos-26
            artifact_name: installer-macos
            bundle_path: desktop/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            desktop -> target
      - run: npm ci
      - name: Build desktop installer
        env:
          CI: "true"
        run: npm run tauri:build
      - name: Verify installer output
        shell: bash
        env:
          BUNDLE_PATH: ${{ matrix.bundle_path }}
        run: |
          shopt -s nullglob
          files=($BUNDLE_PATH)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Missing expected installer at $BUNDLE_PATH" >&2
            exit 1
          fi
          ls -lh "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify dual-platform assets and compute checksums
        run: |
          cd release-assets
          shopt -s nullglob
          win=( *.exe )
          mac=( *.dmg )
          if [ "${#win[@]}" -eq 0 ] || [ "${#mac[@]}" -eq 0 ]; then
            echo "Expected both .exe and .dmg assets" >&2
            ls -la
            exit 1
          fi
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber -R "$REPO"
          else
            cat <<'EOF' | sed "s/__TAG__/${TAG}/g" > release-notes.md
          PodDesk __TAG__ 内测版（Windows 10/11 x64 + macOS Apple Silicon）

          ### 下载与安装
          - **Windows**：下载 `*_x64-setup.exe`（约 6.1 MB，已随包附带 VC++ 运行库）。
          - **macOS (Apple Silicon)**：下载 `*_aarch64.dmg`（约 8.3 MB），打开后将 PodDesk 拖入「应用程序」（离线转写默认启用 Metal 加速）。

          ### 首次打开提示（开源未签名版）
          - **Windows SmartScreen**：遇到「已保护你的电脑」时，点击「更多信息」→「仍要运行」。
          - **macOS Gatekeeper**：首次打开若提示“已损坏，无法打开 / 移到废纸篓”（因未购 Apple 公证签名），拖入「应用程序」后在「终端」执行 `xattr -dr com.apple.quarantine /Applications/PodDesk.app` 即可正常打开。
          EOF
            gh release create "$TAG" release-assets/* \
              -R "$REPO" \
              --draft \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "PodDesk $TAG (内测版)" \
              --notes-file release-notes.md
          fi
