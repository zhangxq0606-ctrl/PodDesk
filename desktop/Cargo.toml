[package]
name = "podcast-desk-desktop"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "PodDesk desktop shell (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
podcast_desk_core = { package = "podcast-desk", path = "../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
