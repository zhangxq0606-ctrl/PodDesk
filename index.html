<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>PodDesk</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%2323201E'/%3E%3Crect x='7.8' y='10.8' width='2.6' height='7.4' rx='1.3' fill='%23FAF7F2'/%3E%3Crect x='12.4' y='7.4' width='2.6' height='14.2' rx='1.3' fill='%23FAF7F2'/%3E%3Crect x='17' y='10.2' width='2.6' height='8.6' rx='1.3' fill='%23FAF7F2'/%3E%3Ccircle cx='21.4' cy='7.4' r='2.6' fill='%23D4622A'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <script>
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("podcast-desk-prefs") || "{}");
          var t = raw && (raw.theme === "dark" || raw.theme === "light" || raw.theme === "system") ? raw.theme : "light";
          var mode = t === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
          var lightIds = ["stone-proof", "linen-folio", "silver-console", "warm-paper"];
          var darkIds = ["graphite-desk", "darkroom-carbon", "studio-slate", "warm-charcoal"];
          var lightLegacy = {
            "pure-morning": "silver-console",
            "bamboo-mist": "linen-folio",
            "apricot-study": "warm-paper",
          };
          var darkLegacy = {
            "deep-slate": "studio-slate",
            "obsidian-cinema": "graphite-desk",
            "pine-ink": "darkroom-carbon",
          };
          var rawLight = raw && raw.lightTheme;
          var rawDark = raw && raw.darkTheme;
          var pal =
            mode === "dark"
              ? darkIds.indexOf(rawDark) >= 0
                ? rawDark
                : darkLegacy[rawDark] || "graphite-desk"
              : lightIds.indexOf(rawLight) >= 0
                ? rawLight
                : lightLegacy[rawLight] || "stone-proof";
          var el = document.documentElement;
          el.setAttribute("data-theme", mode);
          el.setAttribute("data-palette", pal);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
