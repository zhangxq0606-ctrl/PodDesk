[package]
name = "podcast-desk"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "PodDesk — local-first backend & browser workbench for bilingual podcasts, videos, and AI Q&A"

[lib]
name = "podcast_desk_core"
path = "src/lib.rs"

[[bin]]
name = "podcast-desk"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip", "brotli", "system-proxy", "multipart"] }
anyhow = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1 = "0.10"
hex = "0.4"
dirs = "5"
roxmltree = "0.20"
regex = "1"
urlencoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-embed = "8"
mime_guess = "2"
